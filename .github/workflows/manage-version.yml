name: Manage published version

run-name: >-
  ${{ inputs.action }} ${{ inputs.line }}/${{ inputs.minecraft }}
  ${{ inputs.date }} ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Archive a buggy version or restore it
        required: true
        type: choice
        options:
          - yank
          - restore
      line:
        description: Product line
        required: true
        type: choice
        options:
          - cloth
          - anvil
      minecraft:
        description: Minecraft version, for example 26.2
        required: true
        type: string
      date:
        description: Published version date in YYMMDD format
        required: true
        type: string
      release_id:
        description: Optional release ID, for example fix1
        required: false
        type: string
      reason:
        description: Optional internal reason
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: >-
    manage-${{ inputs.line }}-${{ inputs.minecraft }}-${{ inputs.date }}-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Main
        uses: actions/checkout@v6
        with:
          ref: Main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Change Modrinth version status
        id: manage
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          LINE: ${{ inputs.line }}
          MINECRAFT: ${{ inputs.minecraft }}
          DATE: ${{ inputs.date }}
          RELEASE_ID: ${{ inputs.release_id }}
          ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$LINE-$MINECRAFT-$DATE"
          if [[ -n "$RELEASE_ID" ]]; then
            TAG="$TAG-$RELEASE_ID"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          python ci/manage_version.py \
            --config config/products.toml \
            --action "$ACTION" \
            --line "$LINE" \
            --minecraft "$MINECRAFT" \
            --date "$DATE" \
            --release-id "$RELEASE_ID"

      - name: Hide or restore GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manage.outputs.tag }}
          ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          if [[ "$ACTION" == "yank" ]]; then
            gh release edit "$TAG" --draft=true
          else
            gh release edit "$TAG" --draft=false
          fi

      - name: Write operation summary
        env:
          ACTION: ${{ inputs.action }}
          LINE: ${{ inputs.line }}
          MINECRAFT: ${{ inputs.minecraft }}
          DATE: ${{ inputs.date }}
          RELEASE_ID: ${{ inputs.release_id }}
          REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          {
            echo "## Version management"
            echo
            echo "- Action: $ACTION"
            echo "- Product: $LINE"
            echo "- Minecraft: $MINECRAFT"
            echo "- Date: $DATE"
            echo "- Release ID: ${RELEASE_ID:-Not provided}"
            echo "- Reason: ${REASON:-Not provided}"
          } >> "$GITHUB_STEP_SUMMARY"
